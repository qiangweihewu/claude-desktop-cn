name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install app dependencies
        run: npm ci

      - name: Install engine dependencies
        working-directory: engine
        run: bun install

      - name: Copy Bun runtime into app resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path engine/bin | Out-Null
          $bun = (Get-Command bun).Source
          Copy-Item -LiteralPath $bun -Destination engine/bin/bun.exe -Force
          Get-ChildItem engine/bin | Format-Table Name,Length,LastWriteTime

      - name: Write build-time secrets
        shell: pwsh
        env:
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          node -e "const fs=require('fs'); const secrets={}; if(process.env.GH_OAUTH_CLIENT_ID) secrets.GITHUB_CLIENT_ID=process.env.GH_OAUTH_CLIENT_ID; if(process.env.GH_OAUTH_CLIENT_SECRET) secrets.GITHUB_CLIENT_SECRET=process.env.GH_OAUTH_CLIENT_SECRET; fs.writeFileSync('electron/secrets.json', JSON.stringify(secrets,null,2)); console.log('secrets.json written, keys:', Object.keys(secrets));"

      - name: Build engine bundle
        run: npm run build:engine

      - name: Build frontend
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Desktop-CN-Windows
          path: |
            release/Claude-Desktop-CN-Setup-*.exe
            release/Claude-Desktop-CN-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install app dependencies
        run: npm ci

      - name: Install engine dependencies
        working-directory: engine
        run: bun install

      - name: Copy Bun runtime into app resources
        run: |
          mkdir -p engine/bin
          cp "$(command -v bun)" engine/bin/bun
          ls -lah engine/bin

      - name: Write build-time secrets
        env:
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          node -e "const fs=require('fs'); const secrets={}; if(process.env.GH_OAUTH_CLIENT_ID) secrets.GITHUB_CLIENT_ID=process.env.GH_OAUTH_CLIENT_ID; if(process.env.GH_OAUTH_CLIENT_SECRET) secrets.GITHUB_CLIENT_SECRET=process.env.GH_OAUTH_CLIENT_SECRET; fs.writeFileSync('electron/secrets.json', JSON.stringify(secrets,null,2)); console.log('secrets.json written, keys:', Object.keys(secrets));"

      - name: Build engine bundle
        run: npm run build:engine

      - name: Build frontend
        run: npm run build

      - name: Build signed macOS app
        timeout-minutes: 20
        run: npx electron-builder --mac dir --publish never -c.mac.notarize=false
        env:
          DEBUG: electron-builder
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Inspect signed macOS app
        run: |
          APP_PATH="$(find release -name 'Claude Desktop CN.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Could not find signed app bundle in release/"
            find release -maxdepth 3 -print
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Signed app bundle: $APP_PATH"
          du -sh "$APP_PATH"
          echo "File count:"
          find "$APP_PATH" -type f | wc -l

      - name: Zip app for Apple notarization
        run: |
          NOTARY_ZIP="$RUNNER_TEMP/Claude-Desktop-CN-notary.zip"
          APP_DIR="$(dirname "$APP_PATH")"
          APP_NAME="$(basename "$APP_PATH")"
          (cd "$APP_DIR" && ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "$NOTARY_ZIP")
          echo "NOTARY_ZIP=$NOTARY_ZIP" >> "$GITHUB_ENV"
          ls -lh "$NOTARY_ZIP"

      - name: Notarize macOS app
        timeout-minutes: 45
        run: |
          set -o pipefail

          NOTARY_LOG="$RUNNER_TEMP/notarytool-submit.log"
          MAX_ATTEMPTS=3
          notary_status=1

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Notarization attempt $attempt/$MAX_ATTEMPTS"
            set +e
            xcrun notarytool submit "$NOTARY_ZIP" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --timeout 30m \
              --progress 2>&1 | tee "$NOTARY_LOG"
            notary_status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "$notary_status" -eq 0 ]; then
              echo "Notarization succeeded on attempt $attempt"
              break
            fi

            # Exit code 124 = our wait timed out at Apple's side; worth retrying.
            # Other non-zero codes usually mean a real rejection — but the
            # `Invalid` status from notarytool still exits non-zero, so we
            # surface the submission log below before deciding to retry.
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Notarization attempt $attempt failed (status=$notary_status). Sleeping 60s before retry…"
              sleep 60
            fi
          done

          submission_id="$(awk '/id: / && $2 ~ /^[0-9a-f-]+$/ { print $2; exit }' "$NOTARY_LOG" || true)"
          if [ -n "$submission_id" ]; then
            echo "NOTARY_SUBMISSION_ID=$submission_id" >> "$GITHUB_ENV"
            echo "Notary submission id: $submission_id"
          fi

          if [ "$notary_status" -ne 0 ] && [ -n "$submission_id" ]; then
            echo "::group::Notary submission info"
            xcrun notarytool info "$submission_id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            echo "::endgroup::"

            echo "::group::Notary submission log"
            xcrun notarytool log "$submission_id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            echo "::endgroup::"
          fi

          exit "$notary_status"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Staple and validate macOS app
        run: |
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Build macOS distributables
        timeout-minutes: 20
        run: npx electron-builder --mac dmg zip --prepackaged "$APP_PATH" --publish never -c.mac.notarize=false

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Desktop-CN-macOS
          path: |
            release/*.dmg
            release/*.zip
            release/*.dmg.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare release notes
        run: |
          mkdir -p docs/releases
          if [ ! -f "docs/releases/${GITHUB_REF_NAME}-cn.md" ]; then
            printf "Claude Desktop CN %s\n\n- Windows 和 macOS 安装包已由 GitHub Actions 自动构建。\n" "$GITHUB_REF_NAME" > "docs/releases/${GITHUB_REF_NAME}-cn.md"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Claude Desktop CN ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}-cn.md
          files: release-artifacts/**/*
